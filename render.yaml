services:
  - type: web
    name: pet-timer
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pet-timer-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: pet-timer-db
    plan: free
    databaseName: pettimer
    user: pettimer
